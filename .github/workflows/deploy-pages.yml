name: Deploy My Money to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Check required web files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f manifest.webmanifest
          test -f sw.js
          test -f assets/icon-192.png
          test -f assets/icon-512.png
          node --check app.js
          python3 - <<'PY'
          import json
          with open('manifest.webmanifest', encoding='utf-8') as f:
              manifest = json.load(f)
          assert manifest['display'] == 'standalone'
          print('Web app files and PWA manifest look good.')
          PY
      - name: Prepare clean website bundle
        run: |
          mkdir -p _site/assets
          cp index.html styles.css app.js manifest.webmanifest sw.js _site/
          cp assets/icon.svg assets/icon-192.png assets/icon-512.png _site/assets/
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
